name: Build Silmir Unexpected Keyboard

on:
  workflow_dispatch:
  push:
    paths:
      - "assets/silmir_words.txt"
      - "inject_silmir.py"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Silmir build kit
        uses: actions/checkout@v4
        with:
          path: silmir-kit

      - name: Checkout Unexpected Keyboard personal-dictionary branch
        uses: actions/checkout@v4
        with:
          repository: Gareth-Rouse/Unexpected-Keyboard
          ref: personal-dictionary
          submodules: recursive
          path: keyboard

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inject Silmir dictionary
        shell: bash
        run: |
          cp silmir-kit/assets/silmir_words.txt keyboard/assets/silmir_words.txt
          cp silmir-kit/inject_silmir.py keyboard/inject_silmir.py
          cd keyboard
          python3 inject_silmir.py

      - name: Build debug APK
        shell: bash
        run: |
          cd keyboard
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Unexpected-Keyboard-Silmir
          path: keyboard/build/outputs/apk/debug/*.apk
