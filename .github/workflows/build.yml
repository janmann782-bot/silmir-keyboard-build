name: Build Silmir Keyboard v4 ULTRA

on:
  workflow_dispatch:
  push:
    paths:
      - "assets/**"
      - "SilmirTranslator.java"
      - "patch_silmir_keyboard.py"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Silmir build kit
        uses: actions/checkout@v4
        with:
          path: silmir-kit

      - name: Checkout Unexpected Keyboard personal-dictionary branch
        uses: actions/checkout@v4
        with:
          repository: Gareth-Rouse/Unexpected-Keyboard
          ref: personal-dictionary
          submodules: recursive
          path: keyboard

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Add Silmir assets and patch keyboard
        shell: bash
        run: |
          cp silmir-kit/assets/silmir_words.txt keyboard/assets/silmir_words.txt
          cp silmir-kit/assets/silmir_translation_lexicon.tsv keyboard/assets/silmir_translation_lexicon.tsv
          cp silmir-kit/assets/silmir_ru_forms_compact.tsv keyboard/assets/silmir_ru_forms_compact.tsv
          cp silmir-kit/assets/silmir_rules.json keyboard/assets/silmir_rules.json
          cp silmir-kit/assets/silmir_semantic_aliases.tsv keyboard/assets/silmir_semantic_aliases.tsv
          cp silmir-kit/patch_silmir_keyboard.py keyboard/patch_silmir_keyboard.py
          cd keyboard
          python3 patch_silmir_keyboard.py

      - name: Build debug APK
        shell: bash
        run: |
          cd keyboard
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Silmir-Keyboard-v4-ULTRA-debug-apk
          path: keyboard/build/outputs/apk/debug/*.apk
